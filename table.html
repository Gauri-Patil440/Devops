<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            width: 80%;
            min-height: 100px;
            border: 1px solid #000;
            margin: auto;
            padding: 15px;
        }

        .box h1 {
            text-align: center;
        }

        .data {
            width: 98%;
            min-height: 60px;
            padding: 10px;
        }

        .data table {
            width: 90%;
            min-height: 60px;
            border-collapse: collapse;
            margin: auto;
        }

        .data table,
        th,
        tr,
        td {
            border: 1px solid #000;
            padding: 15px;
            text-align: center;
        }

        /* Corrected selector and property */
        .data tr:nth-child(even) {
            background-color: lightgoldenrodyellow;
        }

        .data tr:hover {
            background-color: lightgray;
        }

        .data table th {
            background-color: black;
            color: white;
        }

        .edit {
            width: 100px;
            padding: 10px 20px;
            background-color: royalblue;
            text-decoration: none;
            color: white;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Student Data</h1>

        <div class="data">
            <table>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>

                <tr>
                    <td>1</td>
                    <td>John</td>
                    <td>john@example.com</td>
                    <td>
                        <a href="#" class="edit">Edit</a>
                    </td>
                </tr>

                <tr>
                    <td>2</td>
                    <td>Smith</td>
                    <td>smith@example.com</td>
                    <td>
                        <a href="#" class="edit">Edit</a>
                    </td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
